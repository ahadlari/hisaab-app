<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Room Dashboard — Shared Hostel Expense Manager</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

  :root {
    --bg: #000000;
    --surface: #1C1C1E;
    --surface-2: #2C2C2E;
    --border: #2C2C2E;
    --text-primary: #FFFFFF;
    --text-secondary: #98989D;
    --text-tertiary: #636366;
    --green: #30D158;
    --red: #FF453A;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #000000;
    color: var(--text-primary);
    display: flex;
    justify-content: center;
    padding: 48px 16px;
  }

  .phone {
    width: 390px;
    background: var(--bg);
    border-radius: 40px;
    overflow: hidden;
    border: 1px solid #1C1C1E;
  }

  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 28px 8px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-primary);
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 24px 4px;
  }

  .room-name {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  .avatar-row { display: flex; margin-left: -6px; }

  .avatar {
    width: 26px; height: 26px;
    border-radius: 50%;
    border: 2px solid var(--bg);
    margin-left: -8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 700;
    color: #000;
    background: #636366;
  }

  /* HERO CARD */
  .hero-card {
    margin: 20px 20px 0;
    background: var(--surface);
    border-radius: 24px;
    padding: 28px 24px 24px;
    border: 1px solid var(--border);
  }

  .hero-label {
    font-size: 15px;
    color: var(--text-secondary);
    font-weight: 500;
    margin-bottom: 10px;
  }

  .hero-amount {
    font-size: 52px;
    font-weight: 800;
    letter-spacing: -0.03em;
    font-variant-numeric: tabular-nums;
    color: var(--green);
    line-height: 1;
  }

  .hero-amount .currency { font-size: 34px; font-weight: 700; }

  .hero-sub {
    margin-top: 10px;
    font-size: 15px;
    color: var(--text-secondary);
    font-weight: 400;
  }

  .hero-sub strong { color: var(--text-primary); font-weight: 600; }

  .hero-divider {
    height: 1px;
    background: var(--border);
    margin: 22px 0 18px;
  }

  .quick-add {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: var(--green);
    color: #000000;
    font-weight: 700;
    font-size: 16px;
    padding: 15px;
    border-radius: 14px;
    letter-spacing: -0.01em;
  }

  .quick-add .plus { font-size: 18px; font-weight: 800; }

  /* SECTION */
  .section { padding: 28px 24px 4px; }

  .section-title {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin-bottom: 4px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }

  .section-title .link {
    color: var(--green);
    font-weight: 600;
    font-size: 14px;
  }

  .section-sub {
    font-size: 13.5px;
    color: var(--text-tertiary);
    margin-bottom: 14px;
  }

  /* SETTLEMENT CARD ROWS */
  .settle-card {
    background: var(--surface);
    border-radius: 18px;
    border: 1px solid var(--border);
    overflow: hidden;
  }

  .settle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 18px;
    border-bottom: 1px solid var(--border);
  }
  .settle-row:last-child { border-bottom: none; }

  .settle-left { display: flex; align-items: center; gap: 12px; }

  .settle-avatar {
    width: 40px; height: 40px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700;
    font-size: 15px;
    color: #000;
  }

  .settle-name-block { display: flex; flex-direction: column; }
  .settle-name { font-size: 16px; font-weight: 600; color: var(--text-primary); }
  .settle-desc { font-size: 13px; color: var(--text-tertiary); margin-top: 1px; }

  .settle-right { display: flex; align-items: center; gap: 10px; }
  .settle-amount {
    font-size: 17px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--green);
  }

  .btn-small {
    font-size: 13px;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 10px;
    background: var(--surface-2);
    color: var(--text-primary);
  }

  /* OTHERS LIST */
  .other-list { margin-top: 16px; }

  .other-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 2px;
    border-bottom: 1px solid var(--border);
  }
  .other-row:last-child { border-bottom: none; }

  .other-left { display: flex; align-items: center; gap: 10px; }
  .other-avatar {
    width: 30px; height: 30px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 11px; color: #000;
  }
  .other-name { font-size: 15px; font-weight: 500; color: var(--text-primary); }
  .other-status { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .other-status.positive { color: var(--green); }
  .other-status.negative { color: var(--red); }

  /* BOTTOM NAV */
  .bottom-nav {
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding: 14px 0 22px;
    margin-top: 22px;
    border-top: 1px solid var(--border);
  }

  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    font-size: 10px;
    color: var(--text-tertiary);
    font-weight: 600;
  }

  .nav-item.active { color: var(--text-primary); }
  .nav-icon { width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; }

  .spacer { height: 4px; }
</style>
</head>
<body>

<div class="phone">

  <div class="status-bar">
    <span>9:41</span>
    <span>●●●● 5G 🔋</span>
  </div>

  <div class="topbar">
    <div class="room-name">Room 304</div>
    <div class="avatar-row">
      <div class="avatar" style="background:#30D158;">A</div>
      <div class="avatar" style="background:#64D2FF;">B</div>
      <div class="avatar" style="background:#FF9F0A;">C</div>
      <div class="avatar" style="background:#BF5AF2;">D</div>
    </div>
  </div>

  <div class="hero-card">
    <div class="hero-label">Your balance</div>
    <div class="hero-amount"><span class="currency">₹</span>650</div>
    <div class="hero-sub">You should <strong>receive ₹650</strong> from the room</div>

    <div class="hero-divider"></div>

    <div class="quick-add">
      <span class="plus">+</span> Add expense
    </div>
  </div>

  <div class="section">
    <div class="section-title">
      <span>Settle up</span>
    </div>
    <div class="section-sub">2 people owe you</div>

    <div class="settle-card">
      <div class="settle-row">
        <div class="settle-left">
          <div class="settle-avatar" style="background:#FF9F0A;">C</div>
          <div class="settle-name-block">
            <div class="settle-name">C</div>
            <div class="settle-desc">owes you</div>
          </div>
        </div>
        <div class="settle-right">
          <div class="settle-amount">₹350</div>
          <div class="btn-small">Remind</div>
        </div>
      </div>

      <div class="settle-row">
        <div class="settle-left">
          <div class="settle-avatar" style="background:#BF5AF2;">D</div>
          <div class="settle-name-block">
            <div class="settle-name">D</div>
            <div class="settle-desc">owes you</div>
          </div>
        </div>
        <div class="settle-right">
          <div class="settle-amount">₹300</div>
          <div class="btn-small">Remind</div>
        </div>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">
      <span>Room activity</span>
      <span class="link">See all</span>
    </div>

    <div class="other-list">
      <div class="other-row">
        <div class="other-left">
          <div class="other-avatar" style="background:#64D2FF;">B</div>
          <div class="other-name">B</div>
        </div>
        <div class="other-status positive">receives ₹50</div>
      </div>

      <div class="other-row">
        <div class="other-left">
          <div class="other-avatar" style="background:#FF9F0A;">C</div>
          <div class="other-name">C</div>
        </div>
        <div class="other-status negative">pays ₹350</div>
      </div>

      <div class="other-row">
        <div class="other-left">
          <div class="other-avatar" style="background:#BF5AF2;">D</div>
          <div class="other-name">D</div>
        </div>
        <div class="other-status negative">pays ₹350</div>
      </div>
    </div>
  </div>

  <div class="spacer"></div>

  <div class="bottom-nav">
    <div class="nav-item active">
      <div class="nav-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M3 12l9-9 9 9h-3v9h-4v-6h-4v6H6v-9H3z"/></svg>
      </div>
      Home
    </div>
    <div class="nav-item">
      <div class="nav-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </div>
      History
    </div>
    <div class="nav-item">
      <div class="nav-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
      </div>
      Settle
    </div>
    <div class="nav-item">
      <div class="nav-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
      </div>
      Room
    </div>
  </div>

</div>

</body>
</html>
